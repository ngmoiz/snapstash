name: CI Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_job_1:
    runs-on: ubuntu-latest
    steps:
      - name: install cowsay program
        run: pip install cowsay -y
      - name: execute cowsay cmd
        run: cowsay -c turtle -t "I am a TURTLE" >> turtle.txt
      - name: upload turtle text file
        uses: actions/upload-artifact@v7
        with:
          name: turtle-text-file
          path: turtle.txt
  test_job_1:
    needs: build_job_1
    runs-on: ubuntu-latest
    steps:
      - name: download turtle text file
        uses: actions/download-artifact@v8
        with:
          name: turtle-text-file
      - name: test cowsay program
        run: cat turtle.txt
  script-job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
      - name: executing shell script
        run: |
          chmod +x ascii-script.sh
          ./ascii-script.sh
  snap-job:
    needs: script-job
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
      - name: list repo contents and read file
        run: |
          echo "hello world"
          ls -ltria
          cat README.md
