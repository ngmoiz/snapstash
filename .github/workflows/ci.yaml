name: CI Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
      - name: list repo contents and read file
        run: |
          echo "hello world"
          ls -ltria
          cat README.md
      - name: executing shell script
        run: |
          chmod +x ascii-script.sh
          ./ascii-script.sh