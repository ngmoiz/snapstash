name: CI Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
      - name: list repo contents and read file
        run: |
          echo "hello world"
          ls
          cat README.md
      - name: generate ASCII artwork
        run: cowsay -f dragon "I am a DRAGONNN"