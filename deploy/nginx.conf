# to copy into /etc/nginx/conf.d/default.conf
server {
    listen 80;                     # écoute sur le port public 80
    server_name localhost;         # à quel nom d'hôte ce bloc répond

    location = / {
        root /usr/share/nginx/html/;
        try_files /index.html =404;
    }
    location /uploads/ {
        alias /var/www/images/;
    }
    location / {                   # pour TOUTES les URLs
        proxy_pass http://app:8000;   # → transmets à Gunicorn
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
