apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  labels:
    app: db
spec:
  replicas: 2
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: snapstash
            - name: POSTGRES_USER
              value: paris
            - name: POSTGRES_PASSWORD
              value: montpellier

---
apiVersion: v1
kind: Service
metadata:
  name: db-service
  labels:
    app: db 
spec:
  type: ClusterIP
  selector:
    app: db
  ports:
    - port: 5432
      targetPort: 5432
